<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- মোবাইল রেসপন্সিভ -->
    <title>Basudeb Dental - AI Serial System</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        #container { text-align: center; background: #1e293b; padding: 20px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); width: 100%; max-width: 500px; border: 1px solid #334155; }
        #reader { width: 100%; border-radius: 15px; border: 3px solid #10b981; overflow: hidden; background: #000; height: 250px; }
        #msg-box { margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 12px; min-height: 60px; border-left: 5px solid #10b981; transition: border-color 0.3s; }
        .speaking { border-left-color: #f87171 !important; }
        .btn { background: #10b981; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; width: 100%; font-weight: bold; }
        .btn:active { background: #059669; }
        
        /* সিরিয়াল বোর্ডের ডিজাইন */
        #serial-board { margin-top: 20px; width: 100%; max-width: 500px; background: #1e293b; padding: 15px; border-radius: 15px; border: 1px solid #334155; }
        #serial-board h3 { margin: 0 0 10px 0; color: #fbbf24; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .patient-item { display: flex; justify-content: space-between; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .serial-num { color: #10b981; font-weight: bold; font-size: 1.2rem; }
        .patient-name { color: white; }
        .status-done { color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="container">
    <h2 style="color: #10b981; margin-bottom: 10px; margin-top:0;">🦷 Basudeb Dental AI</h2>
    <button class="btn" id="startBtn" onclick="initSystem()">সিস্টেম চালু করুন</button>
    
    <div id="reader" style="display:none;"></div>
    
    <div id="msg-box">
        <div id="display" style="font-size: 1.1rem; color: #fbbf24;">বাটনে ক্লিক করে সিস্টেম চালু করুন।</div>
    </div>
</div>

<!-- সিরিয়াল বোর্ড -->
<div id="serial-board">
    <h3>বর্তমান সিরিয়াল</h3>
    <div id="patient-list">কোনো পেশেন্ট নেই</div>
</div>

<script>
    let recognition;
    let synth = window.speechSynthesis;
    let scanner;
    let isSpeaking = false;
    
    // কথোপকথনের স্টেট (কোন ধাপে আছে সিস্টেম)
    let conversationState = 'IDLE'; 
    let currentToken = '';
    let currentName = '';

    // লোকাল ডেটাবেস সেটআপ
    const DB_KEY = 'dentalPatientsDB';
    const COUNTER_KEY = 'dentalSerialCounter';

    function getDB() {
        return JSON.parse(localStorage.getItem(DB_KEY) || '{}');
    }
    function saveDB(db) {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        updateSerialBoard();
    }
    function getNextSerial() {
        let count = parseInt(localStorage.getItem(COUNTER_KEY) || '0');
        count++;
        localStorage.setItem(COUNTER_KEY, count.toString());
        return count;
    }

    // ১. ভয়েস সিস্টেম
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'bn-BD';
        recognition.continuous = true;
        recognition.interimResults = false;
    }

    async function speak(text) {
        return new Promise((resolve) => {
            isSpeaking = true;
            document.getElementById('msg-box').classList.add('speaking');
            if (recognition) recognition.stop(); 
            
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'bn-BD';
            
            utter.onend = () => {
                isSpeaking = false;
                document.getElementById('msg-box').classList.remove('speaking');
                if (recognition) {
                    try { recognition.start(); } catch(e) {}
                }
                resolve();
            };
            synth.speak(utter);
        });
    }

    // ২. সিস্টেম ইনিশিয়ালাইজেশন
    async function initSystem() {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('reader').style.display = 'block';
        document.getElementById('display').innerText = "ক্যামেরা চালু হচ্ছে...";
        updateSerialBoard(); // আগের ডেটা স্ক্রিনে দেখানো

        scanner = new Html5Qrcode("reader");
        const config = { fps: 30, qrbox: { width: 200, height: 200 } };

        try {
            // মোবাইলের ব্যাক ক্যামেরা ব্যবহারের জন্য "environment"
            await scanner.start({ facingMode: "environment" }, config, onScanSuccess);
            startListening();
            document.getElementById('display').innerText = "আমি শুনছি, টোকেন দেখান বা কথা বলুন...";
        } catch (err) {
            document.getElementById('display').innerText = "ক্যামেরা পারমিশন দিন বা HTTPS লিংক ব্যবহার করুন।";
        }
    }

    let lastScannedToken = "";
    let scanCooldown = false;

    function onScanSuccess(decodedText) {
        if (isSpeaking || scanCooldown || decodedText === lastScannedToken) return;
        
        lastScannedToken = decodedText;
        scanCooldown = true;
        setTimeout(() => { lastScannedToken = ""; scanCooldown = false; }, 15000);

        processToken(decodedText);
    }

    // ৩. টোকেন প্রসেসিং (নতুন বা পুরানো চেক)
    async function processToken(tokenId) {
        currentToken = tokenId;
        const db = getDB();

        if (db[tokenId]) {
            // টোকেন আগে থেকেই আছে
            conversationState = 'CHECK_STATUS';
            const p = db[tokenId];
            await speak(`আপনার টোকেন বুক আছে। আপনার সিরিয়াল নম্বর ${p.serial}। আপনার কি দেখানো হয়ে গেছে?`);
        } else {
            // নতুন টোকেন
            conversationState = 'ASK_NAME';
            await speak("নতুন টোকেন পাওয়া গেছে। আপনার নাম বলুন।");
        }
    }

    // ৪. ভয়েস কমান্ড হ্যান্ডলিং (স্টেট অনুযায়ী)
    function startListening() {
        if (!recognition) return;
        recognition.start();
        
        recognition.onresult = async (event) => {
            if (isSpeaking) return;
            const last = event.results.length - 1;
            const command = event.results[last][0].transcript.trim();
            document.getElementById('display').innerHTML = `আপনি বলেছেন: <span style="color:white">${command}</span>`;

            const db = getDB();

            if (conversationState === 'ASK_NAME') {
                currentName = command;
                conversationState = 'ASK_ADDRESS';
                await speak(`আপনার নাম ${currentName}। আপনার ঠিকানা বলুন।`);
            
            } else if (conversationState === 'ASK_ADDRESS') {
                const address = command;
                const serial = getNextSerial();
                
                // ডেটাবেসে সেভ
                db[currentToken] = {
                    name: currentName,
                    address: address,
                    serial: serial,
                    status: 'waiting'
                };
                saveDB(db);
                
                conversationState = 'IDLE';
                await speak(`আপনার রেজিস্ট্রেশন সম্পন্ন হয়েছে। আপনার সিরিয়াল নম্বর ${serial}। বসে অপেক্ষা করুন।`);
            
            } else if (conversationState === 'CHECK_STATUS') {
                const ans = command.toLowerCase();
                if (ans.includes("হ্যাঁ") || ans.includes("হ্য") || ans.includes("গেছে") || ans.includes("yes")) {
                    db[currentToken].status = 'done';
                    saveDB(db);
                    await speak("খুব ভালো, আপনার চিকিৎসা শেষ। ধন্যবাদ।");
                } else {
                    await speak("ঠিক আছে, আপনার সিরিয়ালে ডাকা হবে, বসে অপেক্ষা করুন।");
                }
                conversationState = 'IDLE';
            
            } else {
                // সাধারণ কথোপকথন
                await handleChat(command);
            }
        };
        
        recognition.onend = () => {
            if (!isSpeaking) {
                try { recognition.start(); } catch(e) {}
            }
        };
    }

    // সাধারণ কথোপকথন
    async function handleChat(text) {
        let reply = "";
        if (text.includes("কেমন আছ")) reply = "আমি খুব ভালো আছি!";
        else if (text.includes("ডাক্তার")) reply = "ডাক্তারবাবু কিছুক্ষণের মধ্যেই আসবেন।";
        else reply = "আমি আপনার কথা বুঝতে পেরেছি। আপনি কি আপনার টোকেন স্ক্যান করতে চান?";
        await speak(reply);
    }

    // ৫. সিরিয়াল বোর্ড আপডেট (UI)
    function updateSerialBoard() {
        const db = getDB();
        const listDiv = document.getElementById('patient-list');
        const patients = Object.values(db).sort((a, b) => a.serial - b.serial);
        
        if (patients.length === 0) {
            listDiv.innerHTML = "কোনো পেশেন্ট নেই";
            return;
        }

        let html = "";
        patients.forEach(p => {
            const statusText = p.status === 'done' ? '✅ দেখানো হয়েছে' : '⏳ অপেক্ষমাণ';
            const styleClass = p.status === 'done' ? 'status-done' : 'patient-name';
            html += `
                <div class="patient-item">
                    <span class="serial-num">${p.serial}</span>
                    <span class="${styleClass}">${p.name} - ${statusText}</span>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

</script>

</body>
</html>
