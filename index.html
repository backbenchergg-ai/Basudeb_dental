<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Basudeb Dental - AI Assistant</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #container { text-align: center; background: #1e293b; padding: 20px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); width: 95%; max-width: 500px; border: 1px solid #334155; }
        #reader { width: 100%; border-radius: 15px; border: 3px solid #10b981; overflow: hidden; background: #000; height: 280px; }
        #msg-box { margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 12px; min-height: 60px; border-left: 5px solid #10b981; transition: border-color 0.3s; }
        .speaking { border-left-color: #f87171 !important; } /* কথা বলার সময় লাল হবে */
        .active-mic { color: #f87171; font-weight: bold; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }
        .btn { background: #10b981; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin-bottom: 10px; font-weight: bold; }
        .btn:hover { background: #059669; }
    </style>
</head>
<body>

<div id="container">
    <h2 style="color: #10b981; margin-bottom: 10px;">🦷 Basudeb Dental AI</h2>
    <button class="btn" id="startBtn" onclick="initSystem()">সিস্টেম চালু করুন</button>
    
    <div id="reader"></div>
    
    <div id="msg-box">
        <div id="display" style="font-size: 1.1rem; color: #fbbf24;">বাটনে ক্লিক করে কথা বলা শুরু করুন।</div>
    </div>
</div>

<script>
    let recognition;
    let synth = window.speechSynthesis;
    let scanner;
    let isSpeaking = false; // isTalking এর পরিবর্তে isSpeaking ব্যবহার করা হলো
    let lastScannedToken = "";
    let scanCooldown = false;

    // ১. ভয়েস সিস্টেম সেটআপ
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'bn-BD';
        recognition.continuous = true;
        recognition.interimResults = false;
    } else {
        alert("আপনার ব্রাউজার স্পিচ রিকগনিশন সাপোর্ট করে না। অনুগ্রহ করে Google Chrome ব্যবহার করুন।");
    }

    // কথা বলার ফাংশন (এখানে মাইক বন্ধ এবং চালু করার লজিক যোগ করা হয়েছে)
    async function speak(text) {
        return new Promise((resolve) => {
            isSpeaking = true;
            document.getElementById('msg-box').classList.add('speaking');
            
            // এআই কথা বলার সময় মাইক বন্ধ রাখা (যাতে নিজের কথা নিজে না শুনে)
            if (recognition) recognition.stop(); 
            
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'bn-BD';
            
            utter.onend = () => {
                isSpeaking = false;
                document.getElementById('msg-box').classList.remove('speaking');
                // কথা শেষ হলে আবার মাইক চালু করা
                if (recognition) {
                    try { recognition.start(); } catch(e) {}
                }
                resolve();
            };
            
            synth.speak(utter);
        });
    }

    // ২. সব কথার উত্তর (Chat Logic)
    async function handleChat(input) {
        let text = input.toLowerCase().trim();
        let reply = "";

        if (text.includes("কেমন আছ")) reply = "আমি খুব ভালো আছি! বাসুদেব ডেন্টাল ক্লিনিকে আপনাকে সাহায্য করতে পেরে আমি খুশি।";
        else if (text.includes("ডাক্তার") || text.includes("কখন")) reply = "ডাক্তারবাবু কিছুক্ষণের মধ্যেই আসবেন। আপনি চাইলে টোকেনটি ক্যামেরার সামনে স্ক্যান করতে পারেন।";
        else if (text.includes("নাম কি")) reply = "আমি এই ক্লিনিকের এআই অ্যাসিস্ট্যান্ট।";
        else if (text.includes("দাঁত") || text.includes("ব্যথা")) reply = "দাঁতের সমস্যায় অবহেলা করবেন না। আমাদের ডাক্তারবাবু খুব যত্ন সহকারে চিকিৎসা করেন।";
        else reply = "আমি আপনার কথা বুঝতে পেরেছি। আপনি কি আপনার টোকেনটি স্ক্যান করতে চান?";

        await speak(reply);
    }

    // ৩. সিস্টেম ইনিশিয়ালাইজেশন
    async function initSystem() {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('display').innerText = "আমি শুনছি, কথা বলুন বা টোকেন দেখান...";

        scanner = new Html5Qrcode("reader");
        
        const config = { 
            fps: 30, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        };

        try {
            await scanner.start({ facingMode: "environment" }, config, onScanSuccess);
            startListening();
        } catch (err) {
            document.getElementById('display').innerText = "ক্যামেরা বা মাইক পারমিশন দিন। অথবা HTTPS ছাড়া এটি চলবে না।";
            console.error(err);
        }
    }

    // কিউআর স্ক্যান সফল হলে (কুলডাউন লজিক যোগ করা হয়েছে)
    function onScanSuccess(decodedText) {
        // যদি এআই কথা বলছে বা একই টোকেন কুলডাউন টাইমের মধ্যে স্ক্যান হয়, তবে বাদ দিন
        if (isSpeaking || scanCooldown || decodedText === lastScannedToken) return;

        lastScannedToken = decodedText;
        scanCooldown = true;

        processToken(decodedText);

        // ১৫ সেকেন্ড পর আবার একই টোকেন স্ক্যান করা সম্ভব হবে (পেশেন্ট যেন দ্বিতীয়বার স্ক্যান করতে পারে)
        setTimeout(() => {
            lastScannedToken = "";
            scanCooldown = false;
        }, 15000); 
    }

    function startListening() {
        if (!recognition) return;
        
        recognition.start();
        recognition.onresult = async (event) => {
            if (isSpeaking) return;
            const last = event.results.length - 1;
            const command = event.results[last][0].transcript;
            document.getElementById('display').innerHTML = `আপনি বলেছেন: <span style="color:white">${command}</span>`;
            await handleChat(command);
        };
        
        // যদি মাইক সাইলেন্স হয়ে বন্ধ হয়ে যায়, আর এআই কথা না বলছে তবে আবার চালু করবে
        recognition.onend = () => {
            if (!isSpeaking) {
                try { recognition.start(); } catch(e) {}
            }
        };
    }

    async function processToken(data) {
        let id = data.substring(0, 6).toUpperCase();
        document.getElementById('display').innerHTML = `স্ক্যান হয়েছে: <span style="color:#10b981">${id}</span>`;
        await speak("টোকেন পাওয়া গেছে। আইডি নম্বর " + id + "। আপনার নাম বলুন।");
    }
</script>

</body>
</html>
